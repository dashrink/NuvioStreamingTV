[workspace]
members = ["nuvio-core"]
resolver = "2"

[workspace.dependencies]
uniffi = "0.30.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "2.0"
governor = "0.10.2"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread"] }
oauth2 = "4.4"
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"
parking_lot = "0.12"
