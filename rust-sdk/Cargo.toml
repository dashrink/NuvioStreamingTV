[workspace]
members = ["nuvio-core"]
resolver = "2"

[workspace.dependencies]
uniffi = "0.30.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "2.0"
argon2 = "0.5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
