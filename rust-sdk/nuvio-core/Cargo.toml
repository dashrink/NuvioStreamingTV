[package]
name = "nuvio-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]  # CRITICAL: cdylib required for FFI

[dependencies]
uniffi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = { workspace = true }

# HTTP client with rustls TLS backend
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
http = "1.0"

# Middleware support for interceptors
reqwest-middleware = "0.4"

# Retry logic with exponential backoff
reqwest-retry = "0.7"

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Cookie management
cookie_store = "0.22"
reqwest_cookie_store = "0.8"

# TLS certificate pinning
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pemfile = "2.2"
rustls-native-certs = "0.8"

# Async trait support
async-trait = "0.1"

# URL parsing
url = "2.5"

# Middleware extensions
task-local-extensions = "0.1"

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
