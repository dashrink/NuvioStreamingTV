name: Rust SDK CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'rust-sdk/**'
      - '.github/workflows/rust-sdk-ci.yml'
  pull_request:
    paths:
      - 'rust-sdk/**'
      - '.github/workflows/rust-sdk-ci.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build workspace
        run: |
          cd rust-sdk
          cargo build --release --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: rust-sdk-${{ matrix.os }}
          path: rust-sdk/target/release/libnuvio_core.*
          retention-days: 7

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Run tests
        run: |
          cd rust-sdk
          cargo test --verbose --all-features
        env:
          RUST_LOG: debug

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          cache: true

      - name: Run clippy
        run: |
          cd rust-sdk
          cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: true

      - name: Check formatting
        run: |
          cd rust-sdk
          cargo fmt -- --check

  binding-generation:
    name: Generate Bindings (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: kotlin
            os: ubuntu-latest
            lib-ext: so
          - language: swift
            os: macos-latest
            lib-ext: dylib
    steps:
      - uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build library
        run: |
          cd rust-sdk
          cargo build --release

      - name: Install uniffi-bindgen
        run: cargo install uniffi-bindgen --version 0.30.0

      - name: Generate ${{ matrix.language }} bindings
        run: |
          cd rust-sdk
          uniffi-bindgen generate \
            --library target/release/libnuvio_core.${{ matrix.lib-ext }} \
            --language ${{ matrix.language }} \
            --out-dir bindings/${{ matrix.language }}

      - name: Upload bindings
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.language }}-bindings
          path: rust-sdk/bindings/${{ matrix.language }}/*
          retention-days: 7

  cross-platform-build:
    name: Cross-Platform Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-linux-android
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true

      - name: Install Android NDK (for Android targets)
        if: contains(matrix.target, 'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build for ${{ matrix.target }}
        run: |
          cd rust-sdk
          cargo build --release --target ${{ matrix.target }}
