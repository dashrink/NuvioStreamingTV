// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
// @generated begin react-native-google-cast-version-import - expo prebuild (DO NOT MODIFY) sync-751dea5919495636a44001495c681e3442af2777
  ext {
        castFrameworkVersion = "+"
        hilt_version = '2.55'
  }
// @generated end react-native-google-cast-version-import
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
    classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.20-Beta1"
  }
}

allprojects {
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute module('com.caverock:androidsvg') using module('com.caverock:androidsvg-aar:1.4')
        }
    }

  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
